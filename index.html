<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Vision 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#10131a;--panel:#181d27;--line:#2a3242;--fg:#e9edf5;--dim:#98a2b6;--amber:#ffb454;--sky:#6cb6ff;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f8;--panel:#fff;--line:#cfd6e3;--fg:#172033;--dim:#55607a;--amber:#b45f00;--sky:#1b62ad;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);padding:40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto}
p.k{font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0}
h1{font:700 clamp(30px,6vw,46px)/1.1 var(--display);margin:8px 0 12px}
.list{display:grid;gap:10px;margin-top:24px}
a.card{display:grid;gap:4px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--sky);outline:none}
a.card b{font:12px var(--mono);letter-spacing:.06em;color:var(--amber);font-weight:400}
a.card span{color:var(--dim);font-size:15px}
</style>
</head>
<body>
<main>
<p class="k">3D Vision · NeRFs &amp; INR · 2026</p>
<h1>Interactive concept demos</h1>
<p>Move the sliders, predict what happens, then reveal the answer. Each module page works in any browser, on a laptop or a phone.</p>
<div class="list">
  <a class="card" href="module4/"><b>MODULE 4</b>Light, materials, compression and applications<span>30 concepts from Lectures 4.1, 4.2 and 4.3</span></a>
</div>
</main>
</body>
</html>
